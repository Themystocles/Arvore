<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8eaf0">
    <title>Árvore da família | Maria Eliza</title>
    <link rel="stylesheet" href="css/family-tree.css">
    <script src="js/family-tree.js" defer></script>
</head>

<body>
    <main class="page">
        <header class="page-header">
            <div class="heading-copy">
                <p class="eyebrow"><span class="eyebrow-mark" aria-hidden="true">✳</span> Um presente para o futuro</p>
                <h1>As raízes de <span>Eliza.</span></h1>
                <p class="page-subtitle">Uma história feita de quem veio antes.</p>
            </div>
            <div class="local-note">
                <span class="local-note-mark" aria-hidden="true">✦</span>
                <span>Raízes e memórias<br>em uma só árvore.</span>
            </div>
        </header>

        <section class="tree-viewport" id="tree-viewport" aria-label="Árvore genealógica horizontal de Maria Eliza"
            tabindex="0">
            <div class="family-tree" id="family-tree" aria-live="polite"></div>
        </section>
        <p class="photo-status" id="photo-status" role="status" aria-live="polite"></p>
        <footer class="page-footer">
            <span class="footer-spark" aria-hidden="true">✳</span>
            <p>Uma família. Muitas raízes. Uma história só.</p>
            <span class="footer-spark" aria-hidden="true">✳</span>
        </footer>
        <p class="photo-credit">Cerejeiras em flor · <a
                href="https://commons.wikimedia.org/wiki/File:Bonn_cherry_blossoms_Kirschbl%C3%BCten_in_Heerstr.jpg"
                target="_blank" rel="noreferrer">Spielvogel / Wikimedia Commons (CC0)</a></p>
    </main>

    <dialog class="person-editor" id="photo-lightbox" aria-labelledby="editor-title">
        <button class="lightbox-close" type="button" aria-label="Fechar editor">×</button>
        <form class="editor-form">
            <div class="editor-portrait-wrap">
                <button class="editor-portrait-button" type="button" data-action="choose-photo"
                    aria-label="Escolher foto">
                    <img class="lightbox-image" alt="" hidden>
                    <span class="editor-placeholder" aria-hidden="true">+</span>
                </button>
                <input class="editor-file visually-hidden" type="file" accept="image/jpeg,image/png,image/webp">
                <button class="editor-upload" type="button" data-action="choose-photo">Escolher foto</button>
                <button class="remove-photo" type="button" data-action="remove-photo" hidden>Remover foto</button>
            </div>
            <div class="editor-fields">
                <span class="editor-role" id="editor-role"></span>
                <h2 id="editor-title">Editar pessoa</h2>
                <label class="field-label">Nome
                    <input class="editor-name" type="text" maxlength="100" placeholder="Nome da pessoa">
                </label>
                <label class="field-label">Descrição
                    <textarea class="editor-description" maxlength="300" rows="3"
                        placeholder="Uma lembrança ou detalhe..."></textarea>
                </label>
                <p class="editor-status" role="status" aria-live="polite"></p>
                <button class="save-person" type="button" data-action="save">Salvar neste projeto</button>
            </div>
        </form>
    </dialog>
</body>

</html>
